name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raw
          POSTGRES_USER: raw
          POSTGRES_PASSWORD: raw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raw -d raw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: DATABASE_URL=sqlite:///${{ runner.temp }}/raw-migration-test.db alembic -c apps/api/alembic.ini upgrade head
      - run: DATABASE_URL=postgresql://raw:raw@localhost:5432/raw alembic -c apps/api/alembic.ini upgrade head
      - run: PYTHONPATH=apps/api DATABASE_URL=postgresql://raw:raw@localhost:5432/raw python -c "from app.main import case_store; assert len(case_store.policy_sources()) == 2; print('PostgreSQL CaseStore smoke passed')"
      - run: python -m pytest apps/api/tests -q
      - run: python evals/run_workflow_evaluation.py
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r apps/api/requirements.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: PYTHONPATH=apps/api RAW_DATABASE_PATH=${{ runner.temp }}/browser-e2e.db python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > $RUNNER_TEMP/api.log 2>&1 &
      - run: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000 npm run dev -- --hostname 127.0.0.1 > $RUNNER_TEMP/web.log 2>&1 &
        working-directory: apps/web
      - run: until curl --fail --silent http://127.0.0.1:8000/ready && curl --fail --silent http://127.0.0.1:3000; do sleep 1; done
      - run: npm run test:e2e
        working-directory: apps/web
      - if: failure()
        run: cat $RUNNER_TEMP/api.log $RUNNER_TEMP/web.log
