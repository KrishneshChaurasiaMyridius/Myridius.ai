name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: raw
          POSTGRES_USER: raw
          POSTGRES_PASSWORD: raw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raw -d raw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: DATABASE_URL=sqlite:///${{ runner.temp }}/raw-migration-test.db alembic -c apps/api/alembic.ini upgrade head
      - run: DATABASE_URL=postgresql://raw:raw@localhost:5432/raw alembic -c apps/api/alembic.ini upgrade head
      - run: PYTHONPATH=apps/api DATABASE_URL=postgresql://raw:raw@localhost:5432/raw python -c "from app.main import case_store; assert len(case_store.policy_sources()) == 2; print('PostgreSQL CaseStore smoke passed')"
      - run: python -m pytest apps/api/tests -q
      - run: python evals/run_workflow_evaluation.py
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r apps/api/requirements.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
